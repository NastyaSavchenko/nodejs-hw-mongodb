type: object
required:
  - name
  - phoneNumber
  - contactType
  - userId
  - createdAt
  - updatedAt
properties:
  _id:
    type: string
    description: Unique identifier of the contact
    example: 507f191e810c19729de860ea

  name:
    type: string
    description: Full name of the contact
    minLength: 2
    maxLength: 30
    example: Alice

  email:
    type: string
    description: Email address of the contact
    format: email
    example: alice@example.com

  phoneNumber:
    type: string
    description: Phone number of the contact
    minLength: 10
    maxLength: 15
    example: "+123456789"

  contactType:
    type: string
    description: Type of contact (work, home, personal)
    enum: [work, home, personal]
    example: home
    default: personal

  isFavourite:
    type: boolean
    description: Whether the contact is marked as favourite
    example: true
    default: false

  userId:
    type: string
    description: ID of the user who owns the contact
    example: 60b8d295f1a4c22f1436ebf8

  photo:
    type: string
    description: URL of the uploaded contact photo
    example: https://res.cloudinary.com/example/image/upload/sample.jpg
    default: null

  createdAt:
    type: string
    format: date-time
    description: Contact creation timestamp
    example: "2025-06-20T12:34:56.789Z"

  updatedAt:
    type: string
    format: date-time
    description: Contact last update timestamp
    example: "2025-06-20T13:45:00.123Z"