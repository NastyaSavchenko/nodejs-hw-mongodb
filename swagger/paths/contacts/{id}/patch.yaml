tags:
  - Contacts
summary: Update contact by ID
operationId: updateContact
description: Partially update a contact's details by its ID.
security:
  - bearerAuth: []

parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: 507f191e810c19729de860ea

requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            description: Full name of the contact
            example: Alice

          phoneNumber:
            type: string
            description: Phone number of the contact
            example: "+123456789"

          email:
            type: string
            description: Email address of the contact
            example: alice@example.com

          contactType:
            type: string
            description: Type of contact (work, home, personal)
            enum: [work, home, personal]
            example: home

          isFavourite:
            type: boolean
            description: Whether the contact is marked as favourite
            example: true

          photo:
            type: string
            format: binary
            description: Optional updated contact photo

responses:
  '200':
    description: Contact updated successfully
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact!
            data:
              $ref: ../../../components/schemas/patchContact.yaml

  '400':
    $ref: ../../../components/responses/400.yaml

  '401':
    $ref: ../../../components/responses/401.yaml

  '404':
    $ref: ../../../components/responses/404.yaml

  '500':
    $ref: ../../../components/responses/500.yaml