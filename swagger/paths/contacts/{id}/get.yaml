tags:
  - Contacts
summary: Get contact by ID
operationId: getContact
description: Retrieve a specific contact by its ID.

security: 
  - bearerAuth: []

parameters: 
  - in: path
    name: id
    required: true
    schema: 
      type: string
      example: 507f191e810c19729de860ea

responses: 
  '200': 
    description: Get contact by ID
    content: 
      application/json:
        schema: 
          type: object
          required: 
            - status
            - message
            - data
          properties: 
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contact with id 507f191e810c19729de860ea
            data: 
              $ref: ../../../components/schemas/contact.yaml

  '401':
    $ref: ../../../components/responses/401.yaml

  '404':
    description: Contact not found
    content: 
      application/json:
        schema: 
          type: object
          required: 
            - status
            - message
          properties: 
            status: 
              type: integer
              example: 404
            message:
              type: string
              example: Contact not found
  '500':
    $ref: ../../../components/responses/500.yaml