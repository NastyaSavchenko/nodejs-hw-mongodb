tags:
  - Contacts
summary: Create a contact
operationId: createContact
description: Create a new contact and save it to the user's contact list.
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
  
        properties:
          name:
            type: string
            description: Full name of the contact
            example: Alice

          phoneNumber:
            type: string
            description: Phone number of the contact
            example: "+123456789"

          email:
            type: string
            description: Email address of the contact
            example: alice@example.com

          contactType:
            type: string
            description: Type of contact (work, home, personal)
            enum: [work, home, personal]
            example: personal
            default: personal

          isFavourite:
            type: boolean
            description: Whether the contact is marked as favourite
            example: false
            default: false

          photo:
            type: string
            format: binary
            description: Optional photo file
            default: null

responses:
  '201':
    description: Contact created successfully
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact!
            data:
              $ref: ../../components/schemas/contact.yaml

  '400':
   $ref: ../../components/responses/400.yaml

  '401':
    $ref: ../../components/responses/401.yaml

  '500':
    $ref: ../../components/responses/500.yaml