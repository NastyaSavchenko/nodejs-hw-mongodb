openapi: 3.1.0

info:
  version: 1.0.0
  title: Contacts
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: A RESTful API for managing a personal contact book. Allows users to register, log in, and securely manage their contact list with features such as sorting, and image uploading. Includes email verification and password reset functionality.

tags:
  - name: Contacts
    description: Operations with contacts

servers:
  - url: http://127.0.0.1:3000
  - url: ""

paths:
  /contacts/{id}:
    get:
      $ref: "../swagger/paths/contacts/{id}/get.yaml"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
